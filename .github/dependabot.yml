version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      dependencies:
        patterns:
          - '*'

  # Enable version updates for devcontainer
  - package-ecosystem: 'devcontainers'
    directory: '/'
    schedule:
      interval: 'weekly'
